version: 2

sources:
  - name: evalgauge_raw
    schema: main
    tables:
      - name: runs
        columns:
          - name: run_id
            data_tests: [not_null, unique]
          - name: status
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: [completed, failed]
          - name: started_at
            data_tests: [not_null]
          - name: completed_at
            data_tests: [not_null]
          - name: dataset_name
            data_tests: [not_null]
          - name: dataset_version
            data_tests: [not_null]
          - name: dataset_hash
            data_tests: [not_null]
          - name: detector_version
            data_tests: [not_null]
          - name: judge_model
            data_tests: [not_null]
          - name: policy_version
            data_tests: [not_null]
          - name: configuration_hash
            data_tests: [not_null]
          - name: low_threshold
            data_tests: [not_null]
          - name: high_threshold
            data_tests: [not_null]
          - name: git_sha
            data_tests: [not_null]

      - name: events
        columns:
          - name: run_id
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('evalgauge_raw', 'runs')
                    field: run_id
          - name: event_id
            data_tests: [not_null]
          - name: ts
            data_tests: [not_null]
          - name: prompt_hash
            data_tests: [not_null]
          - name: text
            data_tests: [not_null]

      - name: ground_truth
        columns:
          - name: run_id
            data_tests: [not_null]
          - name: event_id
            data_tests: [not_null]
          - name: family
            data_tests: [not_null]
          - name: label
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: [attack, benign]
          - name: is_synthetic
            data_tests: [not_null]
          - name: source
            data_tests: [not_null]
          - name: objective
            data_tests: [not_null]

      - name: detections
        columns:
          - name: run_id
            data_tests: [not_null]
          - name: event_id
            data_tests: [not_null]
          - name: tier1_score
            data_tests: [not_null]
          - name: tier1_band
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: [clear_benign, ambiguous, clear_attack]
          - name: final_flag
            data_tests: [not_null]
          - name: decided_by
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: [fast, judge]
          - name: latency_ms
            data_tests: [not_null]
          - name: judge_cost_usd
            data_tests: [not_null]
