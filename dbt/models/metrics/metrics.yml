version: 2

models:
  - name: mtr_run_comparisons
    description: >
      Paired candidate-versus-baseline attack-family deltas, carrying the evaluation-wide
      false-positive-rate delta beside every catch-rate delta.
    columns:
      - name: candidate_run_id
        data_tests: [not_null]
      - name: baseline_run_id
        data_tests: [not_null]
      - name: evaluation_family
        data_tests: [not_null]
      - name: catch_rate_delta
        data_tests: [not_null]
      - name: false_positive_rate_delta
        data_tests: [not_null]

  - name: mtr_false_positive_burden
    description: >
      One-row-per-run benign burden summary. False-alarm share uses the deliberately
      stratified evaluation mix and is not a production-base-rate estimate.
    columns:
      - name: run_id
        data_tests: [not_null, unique]
      - name: benign_examples
        data_tests: [not_null]
      - name: false_positives
        data_tests: [not_null]
      - name: false_positive_rate
        data_tests: [not_null]

  - name: mtr_performance_by_family
    description: >
      Per-run catch performance by true attack family, paired with evaluation-wide
      benign false-positive burden at the same detector operating point.
    columns:
      - name: run_id
        data_tests: [not_null]
      - name: evaluation_family
        data_tests: [not_null]
      - name: attack_examples
        data_tests: [not_null]
      - name: catch_rate
        data_tests: [not_null]
      - name: false_positive_rate
        data_tests: [not_null]

  - name: mtr_tier_contribution
    description: >
      Per-run final decisions and outcomes by deciding tier. Latency is end-to-end
      event latency, not incremental latency attributable to the judge alone.
    columns:
      - name: run_id
        data_tests: [not_null]
      - name: decided_by
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [fast, judge]
      - name: decisions
        data_tests: [not_null]
