version: 2

models:
  - name: fct_classifications
    description: One complete prediction-versus-truth record per run and evaluated event.
    columns:
      - name: run_id
        data_tests: [not_null]
      - name: event_id
        data_tests: [not_null]
      - name: ground_truth_label
        data_tests: [not_null]
      - name: final_flag
        data_tests: [not_null]

  - name: fct_case_comparisons
    description: One paired baseline-versus-candidate outcome per candidate run and event.
    columns:
      - name: candidate_run_id
        data_tests: [not_null]
      - name: baseline_run_id
        data_tests: [not_null]
      - name: event_id
        data_tests: [not_null]
      - name: is_compatible
        data_tests: [not_null]
      - name: is_fixed
        data_tests: [not_null]
      - name: is_regressed
        data_tests: [not_null]
