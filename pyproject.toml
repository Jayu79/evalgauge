[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evalgauge"
version = "0.1.0"
license = "Apache-2.0"
requires-python = ">=3.9"
dependencies = [
    "dbt-duckdb>=1.9,<2",
    "duckdb>=1.0,<2",
    "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
evalgauge = "evalgauge.offline:main"
evalgauge-compare = "evalgauge.compare:main"

[tool.setuptools.packages.find]
include = ["evalgauge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
